version: "3.8"

services:
  postgresdb:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=achat_db
    ports:
      - 5432:5432
    volumes:
      - db:/var/lib/postgresql/data
  app-backend:
    depends_on:
      - postgresdb
    image: neyssem/spring-backend:1.0.0
    restart: on-failure
    ports:
      - 8085:8080
    environment:
      SPRING_APPLICATION_JSON: '{
        "spring.datasource.url": "jdbc:postgresql://postgresdb:5432/achat_db",
        "spring.datasource.username": "postgres",
        "spring.datasource.password": "postgres",
        "spring.jpa.hibernate.ddl-auto": "update"
      }'
    stdin_open: true
    tty: true

volumes:
  db:
